name: fieldlog_flutter
description: "FieldLog — the capstone app for Cross-Platform Mobile Application Development (Master's, Asia Euro University)."
publish_to: "none"
version: 0.16.0+16

# Week 13 (E13.1): CI/CD with GitHub Actions. Three Android flavors
# (dev / staging / prod) with --dart-define. Signed AAB published to
# Play Store internal testing track via r0adkll/upload-google-play.

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  # Imported directly for SqliteException.
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  drift_dev: ^2.20.0
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
