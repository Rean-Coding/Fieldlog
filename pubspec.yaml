name: fieldlog_flutter
description: "FieldLog — the capstone app for Cross-Platform Mobile Application Development (Master's, Asia Euro University)."
publish_to: "none"
version: 0.8.0+8

# Week 8: Mid-term checkpoint — no new code. Same persistence layer as W7.
# by DriftLogsRepository — a real SQLite-backed implementation. Service,
# Notifier, and UI do not change.

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Week 7: local SQLite via Drift.
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  # Imported directly for SqliteException.
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
