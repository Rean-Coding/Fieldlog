name: fieldlog_flutter
description: "FieldLog — the capstone app for Cross-Platform Mobile Application Development (Master's, Asia Euro University)."
publish_to: "none"
version: 0.5.0+5

# Week 5 (E05.1): AsyncNotifier — explicit handling of loading, data, error,
# and empty states for the new logs feature.
# services in widgets is replaced by Riverpod providers — the application
# layer's dependency injection mechanism.

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.0
  # Week 4: state management + dependency injection.
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Code generation toolchain
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
